services:
  rota:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rota
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8000}:8000" # the proxy
      - "${API_PORT:-8001}:8001"   # REST API + dashboard UI (same origin)
    environment:
      - PROXY_PORT=8000
      - API_PORT=8001
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-rota}
      - DB_PASSWORD=${DB_PASSWORD:-rota_password}
      - DB_NAME=${DB_NAME:-rota}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - ROTA_PASSWORD=${ROTA_PASSWORD:?Set ROTA_PASSWORD; it guards the proxy, the API and the dashboard}
      # Mount the CA files with docker-compose.tls-inspect.yml when enabled.
      - TLS_INSPECT_CA_CERT=${TLS_INSPECT_CA_CERT:-}
      - TLS_INSPECT_CA_KEY=${TLS_INSPECT_CA_KEY:-}
      - TLS_INSPECT_BYPASS_DOMAINS=${TLS_INSPECT_BYPASS_DOMAINS:-}
      # Request and tunnel history lives in Parquet files on the rota-data
      # volume; see .env.example.
      - EVENT_STORE_DIR=${EVENT_STORE_DIR:-}
      - EVENT_STORE_INSTANCE=${EVENT_STORE_INSTANCE:-rota}
      - EVENT_STORE_SYNC=${EVENT_STORE_SYNC:-false}
      # Prometheus metrics at GET :8001/metrics; see .env.example for the
      # OTEL_* vars that additionally enable OTLP push (e.g. to SigNoz).
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      - OTEL_METRIC_EXPORT_INTERVAL=${OTEL_METRIC_EXPORT_INTERVAL:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-}
    volumes:
      # Keeps request history and downloaded GeoIP databases across container
      # recreation.
      - rota-data:/app/data
    networks:
      - rota-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://localhost:8001/health",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: rota-postgres
    restart: unless-stopped
    # Port intentionally NOT exposed to host — DB is internal only.
    environment:
      - POSTGRES_USER=${DB_USER:-rota}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-rota_password}
      - POSTGRES_DB=${DB_NAME:-rota}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rota-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rota} -d ${DB_NAME:-rota}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  rota-data:
    driver: local
  postgres-data:
    driver: local

networks:
  rota-network:
    driver: bridge
